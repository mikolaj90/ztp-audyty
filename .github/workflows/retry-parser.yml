name: Jednorazowa weryfikacja parsera ZTP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retry-parser.yml"

permissions:
  contents: write

concurrency:
  group: ztp-audyty-monitor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m unittest -v

      - name: Sprawdź audyty i wyślij powiadomienia
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Zapisz stan po wysłaniu powiadomienia
        run: |
          if git diff --quiet -- state.json; then
            echo "Brak nowych zdarzeń – bez commita."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Aktualizuj stan po weryfikacji parsera"
          git push
